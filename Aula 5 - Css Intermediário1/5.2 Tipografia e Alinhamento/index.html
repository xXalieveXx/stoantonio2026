<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>5.2 Tipografia e Alinhamento</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 9. Alinhamento (Título Centralizado) -->
    <h1 class="titulo-centralizado">Título Centralizado</h1>

    <!-- 6, 7 e 8. Tamanho, Peso e Estilo -->
    <p class="texto-grande">
        Este texto tem tamanho de 24px, contém uma palavra em <span class="negrito">negrito</span> e outra em <span class="italico">itálico</span>.
    </p>

    <!-- 10. Decoração de Texto (Link Sem Sublinhado) -->
    <p>
        <a href="#" class="link-sem-sublinhado">Clique aqui para acessar o link sem sublinhado</a>
    </p>

</body>
</html>
