<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>5.1 Seletores e Cores</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 2. Título e 3 Parágrafos -->
    <h1>Título Principal</h1>
    <p>Primeiro parágrafo do texto.</p>
    <p>Segundo parágrafo do texto.</p>
    <p>Terceiro parágrafo do texto.</p>

    <!-- 3. Seletores de Classe -->
    <p>Parágrafo normal sem classe.</p>
    <p class="destaque">Parágrafo em destaque com a classe .destaque.</p>

    <!-- 4. Seletores de ID -->
    <div id="principal">
        <p>Conteúdo dentro da div com ID #principal.</p>
    </div>

    <!-- 5. Cores Hexadecimais e RGB -->
    <div class="caixa-colorida">
        <p class="texto-rgb">Texto estilizado usando RGB e fundo Hexadecimal.</p>
    </div>

</body>
</html>
