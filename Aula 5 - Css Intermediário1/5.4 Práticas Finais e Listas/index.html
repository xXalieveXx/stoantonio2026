<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>5.4 Práticas Finais e Listas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 16. Estilização de Listas -->
    <h2>Lista sem marcadores</h2>
    <ul class="lista-sem-marcador">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>

    <!-- 17. Efeito Hover -->
    <h2>Efeito Hover</h2>
    <button class="botao-hover">Passe o mouse aqui</button>

    <!-- 18. Opacidade -->
    <h2>Imagem com Opacidade (50%)</h2>
    <img src="https://via.placeholder.com/150" alt="Exemplo" class="imagem-opaca">

    <!-- 19. Sombras Simples -->
    <h2 class="titulo-com-sombra">Título com Sombra</h2>
    <div class="caixa-com-sombra">Caixa com sombra simples (box-shadow)</div>

    <hr style="margin: 40px 0;">

    <!-- 20. Desafio de Integração: Cartão de Visita Digital -->
    <div class="cartao-visita">
        <img src="https://via.placeholder.com/100" alt="Foto de Perfil" class="foto-perfil">
        <p class="nome-perfil">Seu Nome Aqui</p>
        <p class="descricao-perfil">Desenvolvedor Front-end em aprendizado apaixonado por criar páginas incríveis.</p>
        <a href="#" class="botao-contato">Entrar em Contato</a>
    </div>

</body>
</html>
