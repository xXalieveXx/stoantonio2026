<!DOCTYPE html><!-- Informa ao navegador que este documento usa HTML5 -->
<html lang="pt-BR"><!-- Início do documento HTML. lang="en" indica que o idioma é inglês -->
<head><!-- Início da seção de configurações da página -->
    <meta charset="UTF-8"><!-- Permite o uso de caracteres especiais, como ç, á, é, ã -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><!-- Faz a página se adaptar corretamente a celulares e tablets -->
    <title>Meu Primeiro Site</title><!-- Título que aparece na aba do navegador -->
</head><!-- Fim da seção de configurações -->
<body><!-- Início da parte visível da página -->
    <h1>Olá, mundo!</h1><!-- Aqui fica todo o conteúdo que aparecerá para o usuário -->
    <p>Esse é meu primeiro site em HTML.</p><!-- Aqui fica todo o conteúdo que aparecerá para o usuário -->
</body><!-- Fim da parte visível da página -->
</html><!-- Fim do documento HTML -->
